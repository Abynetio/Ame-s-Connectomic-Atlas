name: Build and deploy site

# Builds the atlas data from the pinned sources, builds the web app, uploads the site as an
# artifact, and publishes it to GitHub Pages when Pages is available:
#   - public repository: always
#   - private repository: only if the repository variable DEPLOY_PAGES is "true"
#     (GitHub Pages for private repositories needs a paid plan).
on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache source atlases
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('pipeline/fetch_mirror.py') }}
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch pinned sources
        run: python pipeline/fetch_mirror.py
      - name: Build atlas data
        run: python pipeline/build.py --out web/public/atlas
      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Upload site (downloadable artifact)
        uses: actions/upload-artifact@v4
        with:
          name: atlas-site
          path: web/dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch && (github.event.repository.private == false || vars.DEPLOY_PAGES == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
