name: Fetch external data

# Downloads sources hosted on Dryad / OSF (see pipeline/fetch_external.py)
# and commits them, with a fetch report, under data/external/ on the same branch.
on:
  workflow_dispatch:
  release:
    types: [published, edited]
  push:
    branches: ["**"] # branch pushes only; creating the source-uploads tag is handled by the release event
    paths:
      - pipeline/fetch_external.py
      - pipeline/import_uploads.py
      - .github/workflows/fetch-external.yml
      - "uploads/**"

permissions:
  contents: write

concurrency:
  # release events commit to the default branch, so they share its queue
  group: fetch-external-${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # release events would otherwise check out the tag; work on the default branch instead
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download
        run: python -I pipeline/fetch_external.py --out data/external --max-mb 60
      - name: Fetch manual uploads attached to the "source-uploads" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p uploads
          if gh release view source-uploads --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download source-uploads --repo "$GITHUB_REPOSITORY" --dir uploads/release --clobber
          else
            echo "no source-uploads release"
          fi
      - name: Import manual uploads
        run: |
          python -I pipeline/import_uploads.py --uploads uploads --out data/external
          rm -rf uploads/release
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/external uploads
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: fetch external sources (run ${{ github.run_id }})"
          BRANCH="${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref_name }}"
          for i in 1 2 3 4; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((2**i))
          done
          exit 1
